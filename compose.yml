# Standalone local run of the perf suite from *inside this repo*.
#
#   docker compose up --build
#
# The suite is a SINGLE plan with two thread groups: the public home page
# (frontend) AND the authenticated project-list endpoints (backend). Before
# JMeter runs it mints a cdp-defra-id-stub token and seeds baseline projects via
# the backend API, so it needs the WHOLE stack reachable — frontend, backend and
# the Defra ID stub — not just the frontend. We do NOT stand the apps up here:
# they need Postgres, Redis, the Defra ID stub and OIDC discovery, which live in
# bng-metric-backend's compose — duplicating that here would just rot. So point
# this at an ALREADY-RUNNING stack, normally the one the harness brings up
# (`npm run dev` in bng-metric-harness, or Tilt).
#
# By default it targets the host stack: frontend on host.docker.internal:3000,
# backend on :3001, stub on :3200. Override to hit a deployed CDP environment,
# e.g.
#   FRONTEND_DOMAIN=bng-metric-frontend.dev.cdp-int.defra.cloud FRONTEND_PORT=443 \
#   BACKEND_DOMAIN=bng-metric-backend.dev.cdp-int.defra.cloud BACKEND_PORT=443 \
#   STUB_BASE_URL=https://cdp-defra-id-stub.dev.cdp-int.defra.cloud/cdp-defra-id-stub \
#   SERVICE_URL_SCHEME=https ENVIRONMENT=dev \
#   docker compose up --build
#
# LocalStack stands in for S3 so the entrypoint's results-publish step has somewhere
# to publish to, mirroring what a CDP task does. It is NOT required: with
# RESULTS_OUTPUT_S3_PATH unset the entrypoint logs "skipping S3 publish" and exits 0.
# Reports land in ./reports on the host either way, so drop both this service and
# RESULTS_OUTPUT_S3_PATH if you only want the run and the report.
services:
  development:
    build: .
    volumes:
      - ./reports:/opt/perftest/reports
    depends_on:
      localstack:
        condition: service_healthy
    # host.docker.internal resolves to the host that runs the frontend. On
    # Docker Desktop it exists already; on Linux it needs this explicit mapping.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - 'compose/aws.env'
    environment:
      S3_ENDPOINT: 'http://localstack:4566'
      RESULTS_OUTPUT_S3_PATH: 's3://test-results'
      TEST_SCENARIO: ${TEST_SCENARIO:-bng-perf}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      # The plan hits BOTH the frontend (home page) and the authenticated backend
      # (project list), and ALWAYS mints a stub token + seeds before JMeter runs —
      # so a full reachable stack (frontend, backend, stub) is required; point each
      # host explicitly below. There is no "frontend-only" mode: SEED_VIA_API=false
      # skips only the seeding step, not the token mint or the backend thread group,
      # so the run still fails fast if the stub or backend is unreachable. Target a
      # deployed env via FRONTEND_DOMAIN / BACKEND_DOMAIN / STUB_BASE_URL.
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-host.docker.internal}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:-host.docker.internal}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      BACKEND_PORT: ${BACKEND_PORT:-3001}
      STUB_BASE_URL: ${STUB_BASE_URL:-http://host.docker.internal:3200/cdp-defra-id-stub}
      # Upload staging POSTs the fixtures to the CDP Uploader, which runs in the
      # backend's compose on the HOST. entrypoint.sh defaults this to
      # localhost:7337 when ENVIRONMENT=local, which is right for a process on the
      # host and wrong from inside this container — there localhost is the
      # container itself, and staging fails the run. Point it at the host like
      # every other target above.
      CDP_UPLOADER_URL: ${CDP_UPLOADER_URL:-http://host.docker.internal:7337}
      SERVICE_URL_SCHEME: ${SERVICE_URL_SCHEME:-http}
      # Which ladder steps run, and so how long a local run takes. `standard` is
      # ~14 min; use `quick` (~5 min) when iterating on a change rather than
      # measuring one, and PERF_DUMP_SCHEDULE=true to see a profile's schedule
      # without running it. See the README's Profiles section.
      PERF_PROFILE: ${PERF_PROFILE:-standard}
      PERF_DUMP_SCHEDULE: ${PERF_DUMP_SCHEDULE:-}
      SOAK_DURATION_SECONDS: ${SOAK_DURATION_SECONDS:-}
    networks:
      - performance-tests

  localstack:
    image: localstack/localstack:4.3.0
    # No host ports published: the only consumer is the `development` container,
    # which reaches it over the compose network as `localstack:4566`. Publishing
    # 4566 would clash with the backend stack's own LocalStack when that is
    # already running (e.g. under Tilt).
    restart: always
    env_file:
      - 'compose/aws.env'
    environment:
      DEBUG: ${DEBUG:-1}
      LS_LOG: WARN # Localstack DEBUG Level
      SERVICES: s3, sqs, sns
      LOCALSTACK_HOST: 127.0.0.1
    volumes:
      - '${TMPDIR:-/tmp}/localstack:/var/lib/localstack'
      - ./compose/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: [ "CMD", "stat", "/tmp/READY" ]
      interval: 3s
      start_period: 5s
      retries: 3
    networks:
      - performance-tests

networks:
  performance-tests:
    driver: bridge
